services:
  db:
    image: postgres:16-alpine
    container_name: apso_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-apso_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apso_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-apso_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - apso_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-apso_user} -d ${POSTGRES_DB:-apso_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: apso_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-apso_user}:${POSTGRES_PASSWORD:-apso_secret_password}@db:5432/${POSTGRES_DB:-apso_db}
      AUTO_SEED_ON_STARTUP: ${AUTO_SEED_ON_STARTUP:-true}
      CPSAT_MAX_TIME_SECONDS: ${CPSAT_MAX_TIME_SECONDS:-25}
      CPSAT_NUM_SEARCH_WORKERS: ${CPSAT_NUM_SEARCH_WORKERS:-8}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

volumes:
  apso_pgdata:
