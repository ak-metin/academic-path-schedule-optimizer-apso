name: APSO CI — Pytest & TypeScript Verification

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  backend-pytest:
    name: Backend (Python 3.12 + OR-Tools CP-SAT + Pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest verification suite
        env:
          PYTHONPATH: backend
        run: |
          pytest backend/tests -v

  frontend-build:
    name: Frontend (React 18 + TypeScript + Vite Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript typecheck and Vite production build
        run: npm run build
